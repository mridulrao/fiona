<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yuki | Mridul Rao</title>
  <link rel="icon" href="data:,">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/cards.css">
  <link rel="stylesheet" href="./css/modal.css">
</head>
<body>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <canvas id="bg-canvas"></canvas>

  <!-- ─── Card stack: full-screen overlay, empty by default ─── -->
  <div id="card-stack"></div>

  <div class="ui">
    <div class="header">
      <div class="header-title">YUKI</div>
      <div class="header-sub">Mridul Rao (Voice Interface)</div>
    </div>

    <div class="orb-wrap">
      <canvas id="orb-canvas" width="280" height="280"></canvas>
      <div class="orb-label" id="orb-label">STANDBY</div>
    </div>

    <div class="freq-bars" id="freq-bars"></div>

    <div class="status-panel">
      <div class="s-ind" id="s-ind">
        <div class="s-dot"></div>
        <span id="s-mode">OFFLINE</span>
      </div>
      <div id="s-text">AWAITING INITIALIZATION</div>
      <div class="ticker" id="ticker">— — —</div>
    </div>

    <div class="controls">
      <button class="btn prim" id="btn-start">⬡ CONNECT</button>
      <button class="btn mic  hide" id="btn-mic">🔇 MUTE</button>
      <button class="btn dng  hide" id="btn-disc">✕ TERMINATE</button>
    </div>
  </div>

  <!-- ── Get User Input widget modal (hidden by default) ── -->
  <div id="form-modal" aria-hidden="true">
    <div class="form-shell" role="dialog" aria-modal="true">
      <div class="form-bar"></div>
      <div class="form-head">
        <div>
          <div class="form-title" id="form-title">Contact Mridul</div>
        </div>
        <button class="form-x" id="form-x">✕</button>
      </div>
      <div class="form-body">
        <div class="form-prompt" id="form-prompt">Leave your details and message below.</div>

        <div class="form-row">
          <div class="form-label">
            <span>NAME</span>
            <span class="form-req">REQUIRED</span>
          </div>
          <input class="form-input" id="fi-name" name="name" type="text" placeholder="Your name" data-required="1" autocomplete="off" spellcheck="false">
        </div>

        <div class="form-row">
          <div class="form-label">
            <span>CONTACT</span>
            <span class="form-req">REQUIRED</span>
          </div>
          <input class="form-input" id="fi-contact" name="contact" type="text" placeholder="Email or phone" data-required="1" autocomplete="off" spellcheck="false">
        </div>

        <div class="form-row">
          <div class="form-label">
            <span>MESSAGE</span>
            <span class="form-req" style="opacity:.35">OPTIONAL</span>
          </div>
          <input class="form-input" id="fi-message" name="message" type="text" placeholder="Anything to add?" data-required="0" autocomplete="off" spellcheck="false">
        </div>

        <div class="form-actions">
          <button class="btn dng" type="button" id="form-cancel">✕ CANCEL</button>
          <button class="btn prim" type="button" id="form-submit">⬡ SUBMIT</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
