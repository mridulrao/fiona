services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm run server
    network_mode: host
    env_file:
      - .env.local
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "pnpm run download-files && pnpm run dev"
    network_mode: host
    env_file:
      - .env.local
    environment:
      - WIDGET_SERVER_BASE_URL=http://localhost:3001
    depends_on:
      - web
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    network_mode: host
    env_file:
      - .env.local
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
