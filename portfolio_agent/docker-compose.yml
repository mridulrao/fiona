services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm run server
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm run dev
    env_file:
      - .env.local
    environment:
      - WIDGET_SERVER_BASE_URL=http://web:3001
    depends_on:
      - web
    restart: unless-stopped
