services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm run server
    expose:
      - "3001"
    env_file:
      - .env.local
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm run dev
    env_file:
      - .env.local
    environment:
      - WIDGET_SERVER_BASE_URL=http://web:3001
    depends_on:
      - web
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    env_file:
      - .env.local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
